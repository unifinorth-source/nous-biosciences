name: Publish NOUS product vial images
on:
  push:
    paths:
      - ".github/workflows/publish-product-vials.yml"
      - "tools/generate-vials.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Build 22 product photographs
        run: python tools/generate-vials.py
      - name: Point catalog to the finished images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "const photo=p.sku==='NB-008'?'nous-diluent-lab.png':'nous-peptide-lab.png';"
          new = "const photo='vials/'+p.sku+'.webp';"
          if old in s:
              p.write_text(s.replace(old, new), encoding="utf-8")
              print("Website catalog updated")
          elif new in s:
              print("Catalog already linked")
          else:
              raise SystemExit("Catalog source markup changed; no unsafe replacement performed")
          PY
      - name: Verify every image and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path("vials").glob("NB-*.webp"))
          assert len(files) == 22, f"Expected 22 images, found {len(files)}"
          for p in files:
              assert p.stat().st_size > 1000, p
          print("Verified:", len(files), "images")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vials/ index.html
          git diff --cached --quiet || git commit -m "Publish 22 realistic NOUS research vial product photos"
          git push
