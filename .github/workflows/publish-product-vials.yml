name: Publish NOUS product vial images
on:
  push:
    paths:
      - ".github/workflows/publish-product-vials.yml"
      - "tools/generate-vials-first10.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Build ten revised product photographs
        run: python tools/generate-vials-first10.py
      - name: Point catalog to the finished images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "const photo=p.sku==='NB-008'?'nous-diluent-lab.png':'nous-peptide-lab.png';"
          new = "const photo='vials/'+p.sku+'.webp';"
          if old in s:
              p.write_text(s.replace(old, new), encoding="utf-8")
              print("Website catalog updated")
          elif new in s:
              print("Catalog already linked")
          else:
              raise SystemExit("Catalog source markup changed; no unsafe replacement performed")
          PY
      - name: Verify every image and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path("vials") / f"NB-{i:03}.webp" for i in range(1,11)]
          for p in files:
              assert p.exists() and p.stat().st_size > 15000, p
          print("Verified:", len(files), "revised product images; other SKUs untouched")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vials/NB-00[1-9].webp vials/NB-010.webp index.html
          git diff --cached --quiet || git commit -m "Replace first ten NOUS product photos with centered vial labels"
          git push
